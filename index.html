<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2026전남드래곤즈</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page">
      <header class="hero-card">
        <h1>2026전남드래곤즈</h1>
        <p class="subtitle">전남 총정리</p>
      </header>

      <section class="menu-card">
        <button class="tab-btn active" data-target="schedule">2026시즌 일정/결과</button>
        <button class="tab-btn" data-target="board">자유게시판</button>
        <button class="tab-btn" data-target="gallery">사진첩</button>
      </section>

      <section id="schedule" class="content-card tab-panel active">
        <h2>2026시즌 일정/결과</h2>
        <ul>
          <li>03.09 홈 개막전 vs 부산 - <strong>2:1 승</strong></li>
          <li>03.16 원정 vs 수원 - <strong>1:1 무</strong></li>
          <li>03.23 홈 vs 성남 - <strong>0:2 패</strong></li>
        </ul>
      </section>

      <section id="board" class="content-card tab-panel">
        <h2>자유게시판</h2>
        <ul>
          <li>오늘 경기 수비 라인 좋았어요!</li>
          <li>다음 홈경기 응원가 이벤트 기대 중</li>
          <li>신규 유니폼 실물 후기 공유합니다</li>
        </ul>
      </section>

      <section id="gallery" class="content-card tab-panel">
        <h2>사진첩</h2>
        <div class="photo-grid">
          <div class="photo-box">훈련장 스냅</div>
          <div class="photo-box">홈경기 응원석</div>
          <div class="photo-box">승리 세리머니</div>
        </div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
