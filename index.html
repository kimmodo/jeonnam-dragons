<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>신도도와전남드래곤즈</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page" id="home-page">
      <header class="hero-card hero-card--with-character">
        <img
          class="hero-character"
          src="./images/character-bottom.png"
          alt=""
        />
        <div class="hero-text">
          <h1>JEONNAM DRAGONS</h1>
          <p class="subtitle">전남은 하나다</p>
          <p class="intro">MADE BY 김모도</p>
        </div>
      </header>

      <nav class="menu-card">
        <a class="nav-btn" href="./schedule.html">2026시즌 일정/결과</a>
        <a class="nav-btn" href="./rank.html">2026시즌 순위</a>
        <a class="nav-btn" href="./board.html">자유게시판</a>
        <a class="nav-btn" href="./gallery.html">사진첩</a>
      </nav>

      <section id="board-auth" class="board-auth board-auth--home" aria-label="계정">
        <div id="board-auth-guest" class="board-auth-guest">
          <p class="board-auth-message">
            Google 로그인 후 자유게시판에 글과 댓글을 남길 수 있습니다.
          </p>
          <button type="button" id="board-google-login" class="board-auth-btn">
            Google 로그인
          </button>
        </div>

        <div id="board-auth-user" class="board-auth-user is-hidden">
          <p class="board-auth-nickname">
            현재 닉네임:
            <strong id="board-current-nickname">-</strong>
          </p>
          <div class="board-auth-actions board-auth-actions--stack">
            <button
              type="button"
              id="board-nickname-toggle"
              class="board-auth-btn board-auth-btn--secondary"
              aria-expanded="false"
            >
              닉네임 변경
            </button>
            <button
              type="button"
              id="board-logout"
              class="board-auth-btn board-auth-btn--secondary"
            >
              로그아웃
            </button>
          </div>
          <div id="board-nickname-panel" class="board-nickname-panel is-hidden">
            <form id="board-nickname-form" class="board-nickname-form">
              <input
                id="board-nickname-input"
                class="board-input"
                type="text"
                maxlength="20"
                placeholder="사이트 닉네임"
                autocomplete="nickname"
              />
              <button type="submit" class="board-auth-btn">닉네임 저장</button>
            </form>
            <p
              id="board-nickname-status"
              class="board-auth-status is-hidden"
              role="status"
              aria-live="polite"
            ></p>
          </div>
        </div>
      </section>

      <div class="bottom-character-wrap">
        <img
          class="bottom-character"
          src="./images/character-left.png"
          alt=""
        />
      </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
