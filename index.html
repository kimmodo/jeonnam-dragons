<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="전남드래곤즈 팬을 위한 비공식 팬페이지. 일정, 결과, 순위, 사진첩, 자유게시판을 확인할 수 있습니다."
    />
    <meta property="og:title" content="YELLOW DRAGONS" />
    <meta
      property="og:description"
      content="전남드래곤즈 팬을 위한 비공식 팬페이지. 일정, 결과, 순위, 사진첩, 자유게시판을 확인할 수 있습니다."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="YELLOW DRAGONS" />
    <meta property="og:image" content="images/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="YELLOW DRAGONS" />
    <meta
      name="twitter:description"
      content="전남드래곤즈 팬을 위한 비공식 팬페이지. 일정, 결과, 순위, 사진첩, 자유게시판을 확인할 수 있습니다."
    />
    <meta name="twitter:image" content="images/og-image.png" />
    <title>YELLOW DRAGONS</title>
    <link rel="icon" href="images/favicon.png" type="image/png" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page" id="home-page">
      <header class="site-header site-header--home">
        <a class="site-brand" href="./index.html">YELLOW DRAGONS</a>
      </header>

      <div class="home-main">
        <div class="home-games-row">
          <div id="home-next-game" class="home-game-slot" aria-live="polite"></div>
          <div id="home-recent-past-game" class="home-game-slot" aria-live="polite"></div>
        </div>

        <nav class="home-menu-grid" aria-label="바로가기">
          <a class="nav-btn" href="./schedule.html">2026시즌 일정/결과</a>
          <a class="nav-btn" href="./rank.html">2026시즌 순위</a>
          <a class="nav-btn" href="./board.html">자유게시판</a>
          <a class="nav-btn" href="./gallery.html">사진첩</a>
        </nav>

        <div class="bottom-character-wrap">
          <img
            class="bottom-character"
            src="./images/character-left.png"
            alt=""
          />
        </div>
      </div>

      <footer class="home-footer">
        <div id="board-auth" class="board-auth-bar board-auth-bar--home" aria-label="계정">
          <div id="board-auth-guest" class="board-auth-bar__guest">
            <button type="button" id="board-google-login" class="board-auth-bar__login-btn">
              Google 로그인
            </button>
          </div>
          <div id="board-auth-user" class="board-auth-bar__user is-hidden">
            <div class="board-auth-bar__row">
              <span id="board-auth-welcome" class="board-auth-bar__welcome"></span>
              <span class="board-auth-bar__sep" aria-hidden="true">·</span>
              <span class="board-auth-bar__links">
                <button
                  type="button"
                  id="board-nickname-toggle"
                  class="board-auth-link-btn"
                  aria-expanded="false"
                >
                  닉네임 변경
                </button>
                <span class="board-auth-bar__sep" aria-hidden="true">·</span>
                <button type="button" id="board-logout" class="board-auth-link-btn">
                  로그아웃
                </button>
              </span>
            </div>
          </div>
          <div id="board-nickname-panel" class="board-auth-bar__panel is-hidden">
            <form id="board-nickname-form" class="board-nickname-form--inline" novalidate>
              <input
                id="board-nickname-input"
                class="board-input board-input--sm"
                type="text"
                maxlength="20"
                placeholder="닉네임"
                autocomplete="nickname"
              />
              <button type="submit" class="board-auth-bar__mini-btn">저장</button>
              <button type="button" id="board-nickname-cancel" class="board-auth-link-btn">
                취소
              </button>
            </form>
            <p
              id="board-nickname-status"
              class="board-auth-status--inline is-hidden"
              role="status"
              aria-live="polite"
            ></p>
          </div>
        </div>
        <p class="home-credit">MADE BY 도도</p>
      </footer>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
