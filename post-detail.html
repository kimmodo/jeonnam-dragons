<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>게시글 | 2026전남드래곤즈</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page" id="post-detail-root">
      <a class="back-link" href="./board.html">← 게시판 목록</a>

      <section class="content-card board-page post-detail-page">
        <div id="board-auth" class="board-auth board-auth--compact" aria-label="계정">
          <div id="board-auth-guest" class="board-auth-guest board-auth-guest--compact">
            <span class="board-auth-message">로그인 후 글·댓글 작성</span>
            <button type="button" id="board-google-login" class="board-auth-btn board-auth-btn--inline">
              로그인
            </button>
          </div>

          <div id="board-auth-user" class="board-auth-user board-auth-user--compact is-hidden">
            <span class="board-auth-user-line">
              <span class="board-auth-label">닉네임</span>
              <strong id="board-current-nickname">-</strong>
            </span>
            <div class="board-auth-actions">
              <button
                type="button"
                id="board-nickname-toggle"
                class="board-auth-link-btn"
                aria-expanded="false"
              >
                닉네임 변경
              </button>
              <button type="button" id="board-logout" class="board-auth-link-btn">
                로그아웃
              </button>
            </div>
            <div id="board-nickname-panel" class="board-nickname-panel is-hidden">
              <form id="board-nickname-form" class="board-nickname-form">
                <input
                  id="board-nickname-input"
                  class="board-input"
                  type="text"
                  maxlength="20"
                  placeholder="사이트 닉네임"
                  autocomplete="nickname"
                />
                <button type="submit" class="board-auth-btn board-auth-btn--inline">저장</button>
              </form>
              <p
                id="board-nickname-status"
                class="board-auth-status is-hidden"
                role="status"
                aria-live="polite"
              ></p>
            </div>
          </div>
        </div>

        <p
          id="post-detail-status"
          class="board-status is-loading"
          role="status"
          aria-live="polite"
        >
          게시글을 불러오는 중...
        </p>
        <div id="post-detail-content"></div>
      </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
