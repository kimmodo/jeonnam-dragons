<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>게시글 | 2026전남드래곤즈</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page" id="post-detail-root">
      <a class="back-link" href="./board.html">← 게시판 목록</a>

      <section class="content-card board-page post-detail-page">
        <div id="board-auth" class="board-auth">
          <div id="board-auth-guest" class="board-auth-guest">
            <p class="board-auth-message">
              Google 로그인 후 글과 댓글을 작성할 수 있습니다.
            </p>
            <button type="button" id="board-google-login" class="btn board-auth-btn">
              Google 로그인
            </button>
          </div>

          <div id="board-auth-user" class="board-auth-user is-hidden">
            <p class="board-auth-nickname">
              현재 닉네임:
              <strong id="board-current-nickname">-</strong>
            </p>
            <button
              type="button"
              id="board-logout"
              class="board-auth-btn board-auth-btn--secondary"
            >
              로그아웃
            </button>
            <form id="board-nickname-form" class="board-nickname-form">
              <input
                id="board-nickname-input"
                class="board-input"
                type="text"
                maxlength="20"
                placeholder="사이트 닉네임"
                autocomplete="nickname"
              />
              <button type="submit" class="board-auth-btn">닉네임 저장</button>
            </form>
            <p
              id="board-nickname-status"
              class="board-auth-status is-hidden"
              role="status"
              aria-live="polite"
            ></p>
          </div>
        </div>

        <p
          id="post-detail-status"
          class="board-status is-loading"
          role="status"
          aria-live="polite"
        >
          게시글을 불러오는 중...
        </p>
        <div id="post-detail-content"></div>
      </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
