<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>자유게시판 | 2026전남드래곤즈</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page">
      <a class="back-link" href="./index.html">← 메인으로 돌아가기</a>

      <section class="content-card board-page" id="board-list-page">
        <h1>자유게시판</h1>
        <p class="desc">전남드래곤즈 팬들의 자유 게시판입니다.</p>

        <div id="board-auth" class="board-auth">
          <div id="board-auth-guest" class="board-auth-guest">
            <p class="board-auth-message">
              Google 로그인 후 글과 댓글을 작성할 수 있습니다.
            </p>
            <button type="button" id="board-google-login" class="btn board-auth-btn">
              Google 로그인
            </button>
          </div>

          <div id="board-auth-user" class="board-auth-user is-hidden">
            <p class="board-auth-nickname">
              현재 닉네임:
              <strong id="board-current-nickname">-</strong>
            </p>
            <button
              type="button"
              id="board-logout"
              class="board-auth-btn board-auth-btn--secondary"
            >
              로그아웃
            </button>
            <form id="board-nickname-form" class="board-nickname-form">
              <input
                id="board-nickname-input"
                class="board-input"
                type="text"
                maxlength="20"
                placeholder="사이트 닉네임"
                autocomplete="nickname"
              />
              <button type="submit" class="board-auth-btn">닉네임 저장</button>
            </form>
            <p
              id="board-nickname-status"
              class="board-auth-status is-hidden"
              role="status"
              aria-live="polite"
            ></p>
          </div>
        </div>

        <div class="board-list-header">
          <h2 class="section-subtitle board-list-heading">게시글 목록</h2>
          <button
            type="button"
            id="board-write-toggle"
            class="board-write-toggle-btn"
            aria-expanded="false"
          >
            글쓰기
          </button>
        </div>

        <p
          id="board-write-hint"
          class="board-write-hint is-hidden"
          role="status"
          aria-live="polite"
        ></p>

        <div id="board-write-section" class="board-write-section is-hidden">
          <form id="board-form" class="board-form" novalidate>
            <div class="board-field">
              <label class="board-label" for="board-title">제목</label>
              <input
                id="board-title"
                class="board-input"
                type="text"
                name="title"
                maxlength="80"
                autocomplete="off"
                placeholder="제목을 입력하세요"
              />
            </div>

            <div class="board-field">
              <label class="board-label" for="board-content">내용</label>
              <textarea
                id="board-content"
                class="board-textarea"
                name="content"
                rows="5"
                maxlength="2000"
                placeholder="내용을 입력하세요"
              ></textarea>
            </div>

            <div id="board-notice-field" class="board-field board-notice-field is-hidden">
              <label class="board-notice-label" for="board-is-notice">
                <input
                  id="board-is-notice"
                  type="checkbox"
                  name="isNotice"
                />
                공지글로 등록
              </label>
            </div>

            <p
              id="board-form-status"
              class="board-status is-hidden"
              role="status"
              aria-live="polite"
            ></p>

            <div class="board-form-actions">
              <button type="submit" class="btn board-submit-btn">등록</button>
              <button type="button" id="board-write-cancel" class="btn board-write-cancel-btn">
                취소
              </button>
            </div>
          </form>
        </div>

        <p
          id="board-list-status"
          class="board-status is-loading"
          role="status"
          aria-live="polite"
        >
          게시글을 불러오는 중...
        </p>
        <div id="board-posts-list" class="board-posts-list"></div>
        <nav
          id="board-pagination"
          class="board-pagination is-hidden"
          aria-label="게시글 페이지"
        ></nav>
      </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
