<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="전남드래곤즈 팬을 위한 비공식 팬페이지. 일정, 결과, 순위, 사진첩, 자유게시판을 확인할 수 있습니다."
    />
    <meta property="og:title" content="자유게시판 | YELLOW DRAGONS" />
    <meta
      property="og:description"
      content="전남드래곤즈 팬을 위한 비공식 팬페이지. 일정, 결과, 순위, 사진첩, 자유게시판을 확인할 수 있습니다."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="YELLOW DRAGONS" />
    <meta property="og:image" content="images/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="자유게시판 | YELLOW DRAGONS" />
    <meta
      name="twitter:description"
      content="전남드래곤즈 팬을 위한 비공식 팬페이지. 일정, 결과, 순위, 사진첩, 자유게시판을 확인할 수 있습니다."
    />
    <meta name="twitter:image" content="images/og-image.png" />
    <title>자유게시판 | YELLOW DRAGONS</title>
    <link rel="icon" href="images/favicon.png" type="image/png" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page">
      <header class="site-header">
        <a class="site-brand" href="./index.html">YELLOW DRAGONS</a>
        <nav class="site-nav" aria-label="주요 메뉴">
          <button
            type="button"
            class="site-nav-toggle"
            aria-expanded="false"
            aria-controls="site-nav-panel"
          >
            메뉴
          </button>
          <div id="site-nav-panel" class="site-nav-panel is-collapsed">
            <div class="site-nav-links">
              <a class="site-nav-link" href="./index.html">메인</a>
              <a class="site-nav-link is-active" href="./board.html" aria-current="page">자유게시판</a>
              <a class="site-nav-link" href="./gallery.html">사진첩</a>
              <a class="site-nav-link" href="./rank.html">순위</a>
              <a class="site-nav-link" href="./schedule.html">일정/결과</a>
            </div>
          </div>
        </nav>
      </header>

      <section class="content-card board-page" id="board-list-page">
        <h1>자유게시판</h1>


        <div id="board-auth" class="board-auth-bar" aria-label="계정">
          <div id="board-auth-guest" class="board-auth-bar__guest">
            <button type="button" id="board-google-login" class="board-auth-bar__login-btn">
              Google 로그인
            </button>
          </div>
          <div id="board-auth-user" class="board-auth-bar__user is-hidden">
            <div class="board-auth-bar__row">
              <span id="board-auth-welcome" class="board-auth-bar__welcome"></span>
              <span class="board-auth-bar__sep" aria-hidden="true">·</span>
              <span class="board-auth-bar__links">
                <button
                  type="button"
                  id="board-nickname-toggle"
                  class="board-auth-link-btn"
                  aria-expanded="false"
                >
                  닉네임 변경
                </button>
                <span class="board-auth-bar__sep" aria-hidden="true">·</span>
                <button type="button" id="board-logout" class="board-auth-link-btn">
                  로그아웃
                </button>
              </span>
            </div>
          </div>
          <div id="board-nickname-panel" class="board-auth-bar__panel is-hidden">
            <form id="board-nickname-form" class="board-nickname-form--inline" novalidate>
              <input
                id="board-nickname-input"
                class="board-input board-input--sm"
                type="text"
                maxlength="20"
                placeholder="닉네임"
                autocomplete="nickname"
              />
              <button type="submit" class="board-auth-bar__mini-btn">저장</button>
              <button type="button" id="board-nickname-cancel" class="board-auth-link-btn">
                취소
              </button>
            </form>
            <p
              id="board-nickname-status"
              class="board-auth-status--inline is-hidden"
              role="status"
              aria-live="polite"
            ></p>
          </div>
        </div>

        <div class="board-list-header">
          <h2 class="section-subtitle board-list-heading">게시글 목록</h2>
          <button
            type="button"
            id="board-write-toggle"
            class="board-write-toggle-btn"
            aria-expanded="false"
          >
            글쓰기
          </button>
        </div>

        <p
          id="board-write-hint"
          class="board-write-hint is-hidden"
          role="status"
          aria-live="polite"
        ></p>

        <div id="board-write-section" class="board-write-section is-hidden">
          <form id="board-form" class="board-form" novalidate>
            <div class="board-field">
              <label class="board-label" for="board-title">제목</label>
              <input
                id="board-title"
                class="board-input"
                type="text"
                name="title"
                maxlength="80"
                autocomplete="off"
                placeholder="제목을 입력하세요"
              />
            </div>

            <div class="board-field">
              <label class="board-label" for="board-content">내용</label>
              <textarea
                id="board-content"
                class="board-textarea"
                name="content"
                rows="5"
                maxlength="2000"
                placeholder="내용을 입력하세요"
              ></textarea>
            </div>

            <div id="board-notice-field" class="board-field board-notice-field is-hidden">
              <label class="board-notice-label" for="board-is-notice">
                <input
                  id="board-is-notice"
                  type="checkbox"
                  name="isNotice"
                />
                공지글로 등록
              </label>
            </div>

            <p
              id="board-form-status"
              class="board-status is-hidden"
              role="status"
              aria-live="polite"
            ></p>

            <div class="board-form-actions">
              <button type="submit" class="btn board-submit-btn">등록</button>
              <button type="button" id="board-write-cancel" class="btn board-write-cancel-btn">
                취소
              </button>
            </div>
          </form>
        </div>

        <p
          id="board-list-status"
          class="board-status is-loading"
          role="status"
          aria-live="polite"
        >
          게시글을 불러오는 중...
        </p>
        <div id="board-posts-list" class="board-posts-list"></div>
        <nav
          id="board-pagination"
          class="board-pagination is-hidden"
          aria-label="게시글 페이지"
        ></nav>
      </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
