<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>사진첩 | 2026전남드래곤즈</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page">
      <header class="site-header">
        <a class="site-brand" href="./index.html">YELLOW DRAGONS</a>
        <nav class="site-nav" aria-label="주요 메뉴">
          <button
            type="button"
            class="site-nav-toggle"
            aria-expanded="false"
            aria-controls="site-nav-panel"
          >
            메뉴
          </button>
          <div id="site-nav-panel" class="site-nav-panel is-collapsed">
            <div class="site-nav-links">
              <a class="site-nav-link" href="./index.html">메인</a>
              <a class="site-nav-link" href="./board.html">자유게시판</a>
              <a class="site-nav-link is-active" href="./gallery.html" aria-current="page">사진첩</a>
              <a class="site-nav-link" href="./rank.html">순위</a>
              <a class="site-nav-link" href="./schedule.html">일정/결과</a>
            </div>
          </div>
        </nav>
      </header>

      <section class="content-card gallery-page">
        <h1>사진첩</h1>
        <p class="desc">
          전남드래곤즈 응원 사진 갤러리입니다. 카드를 누르면 크게 볼 수 있습니다.
        </p>

        <div id="gallery-grid" class="gallery-grid"></div>
      </section>
    </main>

    <div id="gallery-modal" class="gallery-modal is-hidden" aria-hidden="true">
      <div class="gallery-modal-backdrop" data-close-modal="true"></div>
      <div class="gallery-modal-panel" role="dialog" aria-modal="true">
        <button
          type="button"
          class="gallery-modal-close"
          data-close-modal="true"
          aria-label="닫기"
        >
          닫기
        </button>
        <div class="gallery-modal-image-wrap">
          <img id="gallery-modal-image" class="gallery-modal-image" alt="" />
          <p id="gallery-modal-fallback" class="gallery-modal-fallback is-hidden">
            이미지를 불러올 수 없습니다
          </p>
        </div>
        <p id="gallery-modal-title" class="gallery-modal-title"></p>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
