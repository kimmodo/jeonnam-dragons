<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>사진첩 | 2026전남드래곤즈</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page">
      <a class="back-link" href="./index.html">← 메인으로 돌아가기</a>

      <section class="content-card">
        <h1>사진첩</h1>

        <p class="desc">
          팀 사진과 응원 사진을 모아 볼 수 있는 외부 갤러리로 이동할 수
          있습니다. 이 페이지에서는 사진 업로드를 제공하지 않습니다.
        </p>

        <div class="photo-grid">
          <div class="photo-box">훈련장 스냅 (예시)</div>
          <div class="photo-box">홈경기 응원석 (예시)</div>
          <div class="photo-box">승리 세리머니 (예시)</div>
        </div>

        <!-- 여기에 실제 사진첩 URL 입력 -->
        <a class="action-btn" href="#">사진첩으로 이동하기</a>

        <p class="notice">실제 사진 업로드 기능은 추후 백엔드 연결 후 추가 예정</p>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
